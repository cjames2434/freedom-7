  <template id="about-template">
    <article class="prose">
      <h1>How it works</h1>
      <p>Every story on this site is built from the same event as reported by many outlets across the political spectrum. You see who covered it, how each side headlined it, and a plain-language version on top.</p>

      <h2>1. A balanced set of outlets</h2>
      <p>We read the public RSS feeds of news outlets rated left, lean-left, center, lean-right and right by public media-bias raters. The roster is mirrored: the same number of outlets on the left as on the right, and the build refuses to run if that ever drifts. The full list is on the <a href="#/sources">Sources</a> page.</p>

      <h2>2. Opinion is filtered out</h2>
      <p>Opinion columns, editorials, podcasts and newsletters are dropped before anything else happens. Those are where slant lives; we only group straight news.</p>

      <h2>3. Same event, grouped together</h2>
      <p>Articles about the same event are grouped automatically by comparing their headlines and excerpts. Each story shows how many outlets on each side covered it.</p>

      <h2>4. The plainest headline wins</h2>
      <p>For each story we show the headline with the least loaded wording (words like "slams", "destroys" or "bombshell", which every side uses), preferring outlets nearer the center. When AI briefs are switched on, a short neutral summary is written using only what the outlets reported, with claims attributed to whoever made them. Every outlet's own headline is always listed underneath.</p>

      <h2>5. Ranking without outrage</h2>
      <p>Stories rank higher when more outlets cover them, when outlets from more of the spectrum cover them, and when they are recent. There is no personalisation and nothing is ranked by clicks, shares or engagement.</p>

      <h2>6. Blindspots</h2>
      <p>A blindspot is a story mostly covered by one side. Reading them is the quickest way to see what the other side's readers are hearing about.</p>

      <h2>Limits</h2>
      <ul>
        <li>Bias ratings are judgments, and outlets change. They are editable and listed openly.</li>
        <li>Automatic grouping sometimes splits one event into two stories or groups two related events together.</li>
        <li>We only see headlines and short excerpts, never full articles. Read the originals for the full picture.</li>
        <li>AP and Reuters don't offer public feeds, so wire stories reach us through the outlets that run them.</li>
      </ul>
    </article>
  </template>
