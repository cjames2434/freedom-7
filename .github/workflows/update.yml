# Rebuilds the news every 15 minutes and publishes the site to GitHub Pages.
# Free on public repositories. Setup steps are in README.md ("Put it online").

name: Update news

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 minutes (off the top of the hour, when GitHub is busiest)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Keeps the last 48h of articles and the AI brief cache between runs,
      # so stories accumulate across runs and briefs are never paid for twice.
      - name: Restore article store
        uses: actions/cache@v4
        with:
          path: data
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-

      - name: Build news
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_MAX_PER_RUN: ${{ vars.SUMMARY_MAX_PER_RUN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
