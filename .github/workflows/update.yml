# Rebuilds the news every 15 minutes and publishes the site to GitHub Pages.
# Free on public repositories. Setup steps are in README.md ("Put it online").

name: Update news

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 minutes (off the top of the hour, when GitHub is busiest)
    - cron: "41 6 * * *" # once a day: also runs the keepalive job below
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub pauses scheduled workflows in a repository with no commits for 60
  # days, and the site would quietly stop updating. Re-enabling the workflow
  # through the API once a day keeps the schedule running. This job has its
  # own narrow permission and runs no project code.
  keepalive:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '41 6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Keeps the last 48h of articles and the AI brief cache between runs,
      # so stories accumulate across runs and briefs are never paid for twice.
      - name: Restore article store
        uses: actions/cache@v4
        with:
          path: data
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-

      - name: Build news
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_MAX_PER_RUN: ${{ vars.SUMMARY_MAX_PER_RUN }}

      - uses: actions/configure-pages@v5
        id: pages

      # Link previews need the image's full address, which is only known here.
      - name: Point the link-preview image at the published site
        run: sed -i "s|content=\"icons/icon-512.png\"|content=\"${{ steps.pages.outputs.base_url }}/icons/icon-512.png\"|" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
